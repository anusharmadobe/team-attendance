name: Build & Deploy Dashboard

# Triggers: every push to main (data refresh commits) + manual run
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build dashboard → Deploy to Azure Static Web Apps

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build — bake attendance.json into dashboard HTML
        run: python3 build.py

      # ── Deploy to Azure Static Web Apps ──────────────────────────────────
      # SETUP: Create an Azure Static Web App in portal.azure.com, connect it
      # to this repo, then copy the generated deployment token and add it as a
      # GitHub repo secret named AZURE_STATIC_WEB_APPS_API_TOKEN.
      # (Azure does this automatically if you let it create the resource first.)
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist        # build.py outputs here
          output_location: ''       # no sub-folder inside dist
          skip_app_build: true      # we already built above
